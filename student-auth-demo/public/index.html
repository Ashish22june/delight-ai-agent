<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delight AI Agent - Student Login Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 80px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
      }
      label {
        display: block;
        margin-top: 16px;
        font-size: 14px;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 20px;
        padding: 10px 16px;
        cursor: pointer;
      }
      #status {
        margin-top: 16px;
        font-size: 14px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Ava 2.0 - Student Chat Demo</h1>
    <p>Enter a student ID to start a chat. If the student doesn't have a Delight account yet, one is created automatically before the agent loads.</p>

    <label for="studentId">Student ID</label>
    <input id="studentId" placeholder="e.g. student_1024" />

    <label for="nickname">Display Name (optional)</label>
    <input id="nickname" placeholder="e.g. Jane Doe" />

    <button id="startBtn">Start Chat with Ava</button>
    <div id="status"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
